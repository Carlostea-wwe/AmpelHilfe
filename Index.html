<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampelhilfe Pro – Barrierefreie Fußgängerampel-Erkennung</title>
  
  <!-- TensorFlow.js & COCO-SSD Model -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --red-signal: #ff3b30;
      --green-signal: #34c759;
      --neutral-signal: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    header {
      width: 100%;
      max-width: 650px;
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.8rem;
      color: #fff;
    }

    .disclaimer {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
    }

    #status-card {
      width: 100%;
      max-width: 650px;
      padding: 16px;
      border-radius: 12px;
      background-color: var(--card-bg);
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 12px;
      border: 4px solid var(--neutral-signal);
      transition: background-color 0.2s, border-color 0.2s;
    }

    #status-card.rot {
      background-color: rgba(255, 59, 48, 0.25);
      border-color: var(--red-signal);
      color: var(--red-signal);
    }

    #status-card.gruen {
      background-color: rgba(52, 199, 89, 0.25);
      border-color: var(--green-signal);
      color: var(--green-signal);
    }

    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: 65vh;
      min-height: 400px;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #333;
    }

    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      z-index: 10;
    }

    .controls {
      width: 100%;
      max-width: 650px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-group {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label {
      font-size: 1rem;
      font-weight: 600;
    }

    input[type="range"] {
      width: 60%;
      height: 28px;
    }

    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .btn:active {
      opacity: 0.8;
    }

    .file-input-wrapper {
      position: relative;
      width: 100%;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-btn {
      background-color: #34c759;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ampelhilfe Pro</h1>
    <p class="disclaimer">Orientierungshilfe. Ersetzt nicht Langstock oder eigene Einschätzung.</p>
  </header>

  <div id="status-card" aria-live="assertive">Lade Erkennungsmodell...</div>

  <div class="viewport-container">
    <video id="webcam" autoplay muted playsinline></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="zoom-slider">Zoom:</label>
      <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
    </div>

    <div class="file-input-wrapper">
      <label for="image-upload" class="btn file-btn">📷 Eigene Testbilder testen (JPG)</label>
      <input type="file" id="image-upload" accept="image/*" multiple>
    </div>
  </div>

  <script>
    let videoElement = document.getElementById('webcam');
    let canvas = document.getElementById('output-canvas');
    let ctx = canvas.getContext('2d');
    let statusCard = document.getElementById('status-card');
    let zoomSlider = document.getElementById('zoom-slider');
    let fileInput = document.getElementById('image-upload');

    let model = null;
    let videoTrack = null;
    let softwareZoomFactor = 1.0;
    let isTestMode = false;

    // Entprellung (Majority Voting über 7 Frames)
    const FRAME_HISTORY_SIZE = 7;
    let frameHistory = [];
    let currentAnnouncedState = "NONE";

    // Leistungsdrosselung für Live-Ansicht (alle 200 ms)
    let isProcessingFrame = false;
    let lastDetectionTime = 0;
    const DETECTION_INTERVAL_MS = 200;

    // Web Audio API Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function announceState(state) {
      if (state === currentAnnouncedState) return;
      currentAnnouncedState = state;

      if (state === 'ROT') {
        statusCard.textContent = "ROT – Stehen bleiben!";
        statusCard.className = "rot";
        playTone(300, 0.6);
        if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
      } else if (state === 'GRUEN') {
        statusCard.textContent = "GRÜN – Gehen!";
        statusCard.className = "gruen";
        playTone(880, 0.3);
        if (navigator.vibrate) navigator.vibrate([150, 100, 150, 100, 150, 100, 150]);
      } else {
        statusCard.textContent = "Suche nach Ampel...";
        statusCard.className = "";
      }
    }

    // Live-Kamera starten
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoElement.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        
        videoElement.onloadedmetadata = () => {
          canvas.width = videoElement.videoWidth;
          canvas.height = videoElement.videoHeight;
          detectLoop();
        };
      } catch (err) {
        statusCard.textContent = "Kamera-Modus bereit. Testbilder hochladen.";
      }
    }

    // Hybrider Zoom
    zoomSlider.addEventListener('input', async (e) => {
      const zoomVal = parseFloat(e.target.value);
      softwareZoomFactor = zoomVal;

      if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
        const caps = videoTrack.getCapabilities();
        if (caps.zoom) {
          try {
            await videoTrack.applyConstraints({ advanced: [{ zoom: zoomVal }] });
          } catch (err) {
            console.warn("Hardware-Zoom fehlgeschlagen, nutze Software-Zoom Canvas.");
          }
        }
      }
    });

    // Robuste HSV-Farbraumanalyse mit Ausnahmeschutz
    function analyzeTrafficLightHSV(x, y, width, height) {
      if (width <= 0 || height <= 0) return 'NONE';

      try {
        const imgData = ctx.getImageData(x, y, width, height);
        const data = imgData.data;

        let redCountTop = 0;
        let greenCountBottom = 0;
        const midY = height / 2;

        for (let py = 0; py < height; py++) {
          for (let px = 0; px < width; px++) {
            const idx = (py * width + px) * 4;
            const r = data[idx] / 255;
            const g = data[idx + 1] / 255;
            const b = data[idx + 2] / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            const d = max - min;
            s = max === 0 ? 0 : d / max;

            if (max !== min) {
              switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
              }
              h /= 6;
            } else {
              h = 0;
            }

            const hueDeg = h * 360;

            // Rot-Filter (oben)
            if (py < midY && (hueDeg <= 15 || hueDeg >= 340) && s > 0.35 && v > 0.35) {
              redCountTop++;
            }
            // Grün/Cyan-Filter (unten)
            if (py >= midY && (hueDeg >= 115 && hueDeg <= 175) && s > 0.25 && v > 0.35) {
              greenCountBottom++;
            }
          }
        }

        const totalPixels = width * height;
        if (redCountTop / totalPixels > 0.015) return 'ROT';
        if (greenCountBottom / totalPixels > 0.015) return 'GRUEN';
      } catch (e) {
        console.warn("Canvas ImageData konnte nicht ausgelesen werden:", e);
      }

      return 'NONE';
    }

    // Flüssige Live-Erkennungs-Schleife
    async function detectLoop() {
      if (isTestMode) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (softwareZoomFactor > 1.0) {
        const sw = canvas.width / softwareZoomFactor;
        const sh = canvas.height / softwareZoomFactor;
        const sx = (canvas.width - sw) / 2;
        const sy = (canvas.height - sh) / 2;
        ctx.drawImage(videoElement, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      }

      const now = Date.now();

      // KI-Analyse gedrosselt ausführen (alle 200 ms)
      if (model && !isProcessingFrame && (now - lastDetectionTime > DETECTION_INTERVAL_MS)) {
        isProcessingFrame = true;
        lastDetectionTime = now;

        try {
          const predictions = await model.detect(canvas, 10, 0.15);
          let frameState = 'NONE';

          predictions.forEach(pred => {
            const [x, y, w, h] = pred.bbox;
            const aspectRatio = h / w;

            if ((pred.class === 'traffic light' || pred.class === 'person') && aspectRatio > 1.1) {
              const rx = Math.max(0, Math.floor(x));
              const ry = Math.max(0, Math.floor(y));
              const rw = Math.min(canvas.width - rx, Math.floor(w));
              const rh = Math.min(canvas.height - ry, Math.floor(h));

              const state = analyzeTrafficLightHSV(rx, ry, rw, rh);
              
              if (state !== 'NONE') {
                frameState = state;
                ctx.strokeStyle = state === 'ROT' ? '#ff3b30' : '#34c759';
                ctx.lineWidth = 4;
                ctx.strokeRect(rx, ry, rw, rh);
              }
            }
          });

          // Fallback-Scan auf dem gesamten Canvas bei kleinen Ampeln
          if (frameState === 'NONE') {
            frameState = analyzeTrafficLightHSV(0, 0, canvas.width, canvas.height);
          }

          frameHistory.push(frameState);
          if (frameHistory.length > FRAME_HISTORY_SIZE) frameHistory.shift();

          const rotVotes = frameHistory.filter(s => s === 'ROT').length;
          const gruenVotes = frameHistory.filter(s => s === 'GRUEN').length;

          if (rotVotes >= 4) announceState('ROT');
          else if (gruenVotes >= 4) announceState('GRUEN');
          else if (frameHistory.every(s => s === 'NONE')) announceState('NONE');

        } catch (err) {
          console.error("Live-Analysefehler:", err);
        } finally {
          isProcessingFrame = false;
        }
      }

      requestAnimationFrame(detectLoop);
    }

    // Datei-Upload & Asynchroner Test-Runner (CORS Taint Fix)
    fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (!files || !files.length) return;

      isTestMode = true;
      const file = files[0];
      const reader = new FileReader();

      reader.onload = (event) => {
        const img = new Image();
        img.crossOrigin = "anonymous"; // Tainted-Canvas-Sperre auf Mobilgeräten verhindern

        img.onload = async () => {
          canvas.width = img.naturalWidth || img.width;
          canvas.height = img.naturalHeight || img.height;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          statusCard.textContent = "Analysiere Testbild...";
          statusCard.className = "";

          // Rendern abwarten
          await new Promise(r => setTimeout(r, 100));

          if (model) {
            try {
              const predictions = await model.detect(canvas, 10, 0.15);
              let detectedState = 'NONE';

              predictions.forEach(pred => {
                const [x, y, w, h] = pred.bbox;
                const rx = Math.max(0, Math.floor(x));
                const ry = Math.max(0, Math.floor(y));
                const rw = Math.min(canvas.width - rx, Math.floor(w));
                const rh = Math.min(canvas.height - ry, Math.floor(h));

                const state = analyzeTrafficLightHSV(rx, ry, rw, rh);
                
                if (state !== 'NONE') {
                  detectedState = state;
                  ctx.strokeStyle = state === 'ROT' ? '#ff3b30' : '#34c759';
                  ctx.lineWidth = Math.max(4, Math.floor(canvas.width / 200));
                  ctx.strokeRect(rx, ry, rw, rh);
                }
              });

              // Ganzbild-Fallback für entfernte Signale
              if (detectedState === 'NONE') {
                detectedState = analyzeTrafficLightHSV(0, 0, canvas.width, canvas.height);
              }

              announceState(detectedState);

            } catch (err) {
              console.error("Testbild-Analysefehler:", err);
              statusCard.textContent = "Fehler bei Bildzugriff.";
            }
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Start-Up
    window.addEventListener('load', async () => {
      try {
        model = await cocoSsd.load();
        statusCard.textContent = "Bereit. Kamera oder Testbild laden.";
        initCamera();
      } catch (err) {
        statusCard.textContent = "Fehler beim Laden des KI-Modells.";
      }
    });
  </script>
</body>
</html>
