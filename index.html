<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
    video { display: none; }
  </style>
</head>
<body>

  <div id="status">Bereit zum Testen.</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <video id="webcam" autoplay playsinline></video>
  
  <input type="file" id="imageLoader" accept="image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');
    const video = document.getElementById('webcam');

    let model = null;
    let isProcessing = false;
    let isStaticImage = false;

    // KI-Modell mit 4-Sekunden-Timeout laden
    const loadModelWithTimeout = () => {
      const timeout = new Promise((_, reject) => 
        setTimeout(() => reject(new Error("Timeout")), 4000)
      );
      
      Promise.race([cocoSsd.load(), timeout])
        .then(loadedModel => {
          model = loadedModel;
          statusDiv.innerText = "KI-Modell geladen & bereit.";
          statusDiv.style.borderColor = "#28a745";
        })
        .catch(() => {
          statusDiv.innerText = "Schnell-Modus aktiv (Licht-Erkennung).";
          statusDiv.style.borderColor = "#ffc107";
        });
    };
    loadModelWithTimeout();
