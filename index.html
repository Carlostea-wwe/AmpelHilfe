<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
    video { display: none; }
  </style>
</head>
<body>

  <div id="status">Starte Kamera...</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <video id="webcam" autoplay playsinline></video>
  
  <input type="file" id="imageLoader" accept="image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');
    const video = document.getElementById('webcam');

    let isStaticImage = false;

    // 1. RGB zu HSV Konvertierung
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // 2. HSV-Analyse mit Dichte-Filter (Clustering)
    function detectGreenLightRegion(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // 2D-Maske für grüne Pixel erstellen
      const mask = new Array(height).fill(0).map(() => new Uint8Array(width));
      let rawCount = 0;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const [h, s, v] = rgbToHsv(r, g, b);

          // Grün-Filter für Signal-LEDs
          if (h >= 115 && h <= 170 && s >= 35 && v >= 45) {
            mask[y][x] = 1;
            rawCount++;
          }
        }
      }

      if (rawCount < 4) {
        return { found: false, pixelCount: 0, boundingBox: null };
      }

      // Dichte-Prüfung: Nur Pixel werten, die grüne Nachbarn im Umkreis haben (Filtert Baumlaub)
      let minX = width, maxX = 0, minY = height, maxY = 0;
      let densePixelCount = 0;
      const radius = 2; // Suchradius in Pixeln

      for (let y = radius; y < height - radius; y++) {
        for (let x = radius; x < width - radius; x++) {
          if (mask[y][x] === 1) {
            let neighbors = 0;

            for (let ny = -radius; ny <= radius; ny++) {
              for (let nx = -radius; nx <= radius; nx++) {
                if (mask[y + ny][x + nx] === 1) neighbors++;
              }
            }

            // Wenn mindestens 4 grüne Pixel im 5x5 Umfeld liegen -> Signal-Cluster
            if (neighbors >= 4) {
              densePixelCount++;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
      }

      const hasGreenLight = densePixelCount >= 4;

      return {
        found: hasGreenLight,
        pixelCount: densePixelCount,
        boundingBox: hasGreenLight ? {
          x: minX,
          y: minY,
          width: maxX - minX,
          height: maxY - minY
        } : null
      };
    }

    // 3. Schritt 2: Ausschnitt (ROI) für das KI-Modell zuschneiden
    function getCroppedCanvas(sourceCanvas, box, paddingPercent = 0.5) {
      const padX = Math.round(box.width * paddingPercent);
      const padY = Math.round(box.height * paddingPercent);

      const cropX = Math.max(0, box.x - padX);
      const cropY = Math.max(0, box.y - padY);
      const cropW = Math.min(sourceCanvas.width - cropX, box.width + padX * 2);
      const cropH = Math.min(sourceCanvas.height - cropY, box.height + padY * 2);

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = cropW;
      cropCanvas.height = cropH;
      const cropCtx = cropCanvas.getContext('2d');

      cropCtx.drawImage(
        sourceCanvas,
        cropX, cropY, cropW, cropH,
        0, 0, cropW, cropH
      );

      // cropCanvas kann direkt an das Modell übergeben werden (z. B. model.predict(cropCanvas))
      return cropCanvas;
    }

    // 4. Auswertung und Zeichnen
    function processFrame() {
      const result = detectGreenLightRegion(ctx, canvas.width, canvas.height);

      if (result.found) {
        statusDiv.innerText = `Grünes Signal erkannt! (${result.pixelCount} Pixel)`;
        statusDiv.style.borderColor = "#28a745";
        
        const box = result.boundingBox;

        // ROI für Modell-Klassifizierung vorbereiten
        const croppedRoiCanvas = getCroppedCanvas(canvas, box, 0.4);
        // Hier Modell-Aufruf einbauen: analyzeWithModel(croppedRoiCanvas);

        // Visuelle Markierung auf dem Canvas zeichnen
        ctx.strokeStyle = '#00FF00';
        ctx.lineWidth = 3;
        ctx.strokeRect(box.x, box.y, Math.max(box.width, 4), Math.max(box.height, 4));
      } else {
        statusDiv.innerText = "Kein grünes Signal erkannt.";
        statusDiv.style.borderColor = "#dc3545";
      }
    }

    // 5. Kamera-Stream
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          renderLoop();
        };
      } catch (err) {
        statusDiv.innerText = "Kamera nicht verfügbar. Bitte Testbild laden.";
      }
    }

    function renderLoop() {
      if (!isStaticImage && video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        processFrame();
      }
      requestAnimationFrame(renderLoop);
    }

    // 6. Datei-Upload
    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          isStaticImage = true;
          
          const maxDim = 800;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          processFrame();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    startCamera();
  </script>
</body>
</html>
