    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // Analyse der Signal-Farbe in einem bestimmten ROI (Region of Interest)
    function analyzeColorInRoi(ctx, x, y, w, h) {
      const imgData = ctx.getImageData(Math.max(0, Math.round(x)), Math.max(0, Math.round(y)), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
      const data = imgData.data;

      let greenCount = 0;
      let redCount = 0;

      for (let i = 0; i < data.length; i += 4) {
        const [hue, sat, val] = rgbToHsv(data[i], data[i + 1], data[i + 2]);

        // Grünes Signal (115° - 175°, hohes Licht/Sättigung)
        if (hue >= 115 && hue <= 175 && sat >= 30 && val >= 40) greenCount++;
        // Rotes Signal (0°-15° oder 335°-360°)
        if ((hue <= 15 || hue >= 335) && sat >= 40 && val >= 40) redCount++;
      }

      if (greenCount > redCount && greenCount >= 2) return { color: 'green', count: greenCount };
      if (redCount > greenCount && redCount >= 2) return { color: 'red', count: redCount };
      return { color: 'unknown', count: 0 };
    }

    // Fallback-Funktion: Direkte Suche nach leuchtenden Signal-Farben im Gesamtbild
    function colorFallbackSearch(width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      let minX = width, maxX = 0, minY = height, maxY = 0;
      let greenCount = 0, redCount = 0;

      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          const i = (y * width + x) * 4;
          const [h, s, v] = rgbToHsv(data[i], data[i + 1], data[i + 2]);

          const isGreen = (h >= 120 && h <= 170 && s >= 45 && v >= 50);
          const isRed = ((h <= 12 || h >= 340) && s >= 60 && v >= 50);

          if (isGreen || isRed) {
            if (isGreen) greenCount++;
            if (isRed) redCount++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const total = greenCount + redCount;
      const boxW = maxX - minX;
      const boxH = maxY - minY;

      // Verwirft extrem breite Cluster (z. B. Laubwand im Hintergrund)
      if (total >= 4 && (boxW / (boxH || 1)) < 2.2) {
        return {
          found: true,
          color: greenCount > redCount ? 'green' : 'red',
          bbox: [minX, minY, Math.max(boxW, 15), Math.max(boxH, 15)]
        };
      }
      return { found: false };
    }
