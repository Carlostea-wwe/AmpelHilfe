<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
    video { display: none; }
  </style>
</head>
<body>

  <div id="status">Bereit. Lade KI im Hintergrund...</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <video id="webcam" autoplay playsinline></video>
  
  <input type="file" id="imageLoader" accept="image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');
    const video = document.getElementById('webcam');

    let model = null;
    let isModelLoading = true;
    let isProcessing = false;
    let isStaticImage = false;

    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
      isModelLoading = false;
      statusDiv.innerText = "KI-Modell bereit!";
      statusDiv.style.borderColor = "#28a745";
    }).catch(err => {
      isModelLoading = false;
      statusDiv.innerText = "Nacht-/Farb-Fallback aktiv.";
    });

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // 1. Farbanalyse in einer Region (ROI)
    function analyzeColorInRoi(ctx, x, y, w, h) {
      const rx = Math.max(0, Math.round(x));
      const ry = Math.max(0, Math.round(y));
      const rw = Math.max(1, Math.min(canvas.width - rx, Math.round(w)));
      const rh = Math.max(1, Math.min(canvas.height - ry, Math.round(h)));

      const imgData = ctx.getImageData(rx, ry, rw, rh);
      const data = imgData.data;

      let greenCount = 0;
      let redCount = 0;

      for (let i = 0; i < data.length; i += 4) {
        const [hue, sat, val] = rgbToHsv(data[i], data[i + 1], data[i + 2]);

        // Grün-Toleranz (auch bei hellem Tageslicht/LEDs)
        if (hue >= 110 && hue <= 175 && sat >= 25 && val >= 40) greenCount++;
        // Rot-Toleranz
        if ((hue <= 18 || hue >= 330) && sat >= 35 && val >= 40) redCount++;
      }

      if (greenCount > redCount && greenCount >= 2) return { color: 'green', count: greenCount };
      if (redCount > greenCount && redCount >= 2) return { color: 'red', count: redCount };
      return { color: 'unknown', count: 0 };
    }

    // 2. Nacht-/Dunkelheits-Fallback (Sucht isolierte Leuchtpunkte bei Nacht/Verdeckung)
    function nightSpotSearch(width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      let minX = width, maxX = 0, minY = height, maxY = 0;
      let greenCount = 0, redCount = 0;

      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          const i = (y * width + x) * 4;
          const r = data[i], g = data[i+1], b = data[i+2];
          const [h, s, v] = rgbToHsv(r, g, b);

          // Suche nach hellem Signal-Licht (Value > 60%)
          const isBrightGreen = (h >= 115 && h <= 175 && s >= 30 && v >= 60);
          const isBrightRed = ((h <= 15 || h >= 335) && s >= 45 && v >= 60);

          if (isBrightGreen || isBrightRed) {
            if (isBrightGreen) greenCount++;
            if (isBrightRed) redCount++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const total = greenCount + redCount;
      const boxW = maxX - minX;
      const boxH = maxY - minY;

      // Wenn ein kompakter Leuchtfleck im Bild gefunden wird
      if (total >= 3 && boxW > 0 && boxH > 0 && (boxW / boxH) < 2.5 && boxW < (width * 0.4)) {
        return {
          found: true,
          color: greenCount > redCount ? 'green' : 'red',
          bbox: [
            Math.max(0, minX - 15), 
            Math.max(0, minY - 15), 
            Math.min(width, boxW + 30), 
            Math.min(height, boxH + 30)
          ]
        };
      }
      return { found: false };
    }

    // 3. Hauptanalyse
    async function processFrame() {
      if (isProcessing) return;
      isProcessing = true;

      try {
        let detected = false;

        // Schritt A: Objekterkennung (Niedrigerer Threshold 0.10)
        if (model) {
          const predictions = await model.detect(canvas);
          const candidates = predictions.filter(p => (p.class === 'traffic light' || p.class === 'stop sign') && p.score > 0.10);

          if (candidates.length > 0) {
            // Filtere Treffer, die auch tatsächlich ein Licht im ROI haben
            for (const cand of candidates) {
              const res = analyzeColorInRoi(ctx, cand.bbox[0], cand.bbox[1], cand.bbox[2], cand.bbox[3]);
              if (res.color !== 'unknown') {
                drawResult(res.color, cand.bbox, Math.round(cand.score * 100));
                detected = true;
                break;
              }
            }
          }
        }

        // Schritt B: Fallback für Nachtaufnahmen & verdeckte Ampeln (Bild 2, 5, 6)
        if (!detected) {
          const fallback = nightSpotSearch(canvas.width, canvas.height);
          if (fallback.found) {
            drawResult(fallback.color, fallback.bbox, null);
            detected = true;
          }
        }

        if (!detected) {
          statusDiv.innerText = "Keine Ampel erkannt.";
          statusDiv.style.borderColor = "#dc3545";
        }

      } catch (err) {
        console.error(err);
      } finally {
        isProcessing = false;
      }
    }

      const [x, y, w, h] = bbox;
      let text = "";
      let strokeColor = "#FFD700";

      if (color === 'green') {
        text = `Grüne Ampel erkannt!${
