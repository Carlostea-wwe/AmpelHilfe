<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      height: 350px;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
    video { display: none; }
  </style>
</head>
<body>

  <div id="status">Wähle ein Bild oder starte die Kamera</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <video id="webcam" autoplay playsinline></video>
  
  <input type="file" id="imageLoader" accept="image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');
    const video = document.getElementById('webcam');

    let model = null;
    let isProcessing = false;
    let isStaticImage = false;

    // Initiales Canvas zeichnen damit es nie leer bleibt
    function resetCanvas() {
      canvas.width = 600;
      canvas.height = 400;
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#888888';
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Kein Bild geladen', canvas.width / 2, canvas.height / 2);
    }
    resetCanvas();

    // KI-Modell laden (völlig unkritisch im Hintergrund)
    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
      console.log("KI-Modell bereit");
    }).catch(err => {
      console.log("KI nicht verfügbar, nutze Licht-Fallback");
    });

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    function analyzeColorInRoi(ctx, x, y, w, h) {
      const rx = Math.max(0, Math.round(x));
      const ry = Math.max(0, Math.round(y));
      const rw = Math.max(1, Math.min(canvas.width - rx, Math.round(w)));
      const rh = Math.max(1, Math.min(canvas.height - ry, Math.round(h)));

      const imgData = ctx.getImageData(rx, ry, rw, rh);
      const data = imgData.data;

      let greenCount = 0, redCount = 0;

      for (let i = 0; i < data.length; i += 4) {
        const [hue, sat, val] = rgbToHsv(data[i], data[i + 1], data[i + 2]);
        if (hue >= 110 && hue <= 175 && sat >= 25 && val >= 40) greenCount++;
        if ((hue <= 18 || hue >= 330) && sat >= 35 && val >= 40) redCount++;
      }

      if (greenCount > redCount && greenCount >= 2) return 'green';
      if (redCount > greenCount && redCount >= 2) return 'red';
      return 'unknown';
    }

    function lightSpotSearch(width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      let minX = width, maxX = 0, minY = height, maxY = 0;
      let greenCount = 0, redCount = 0;

      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          const i = (y * width + x) * 4;
          const [h, s, v] = rgbToHsv(data[i], data[i + 1], data[i + 2]);

          const isGreen = (h >= 115 && h <= 175 && s >= 30 && v >= 55);
          const isRed = ((h <= 18 || h >= 335) && s >= 40 && v >= 55);

          if (isGreen || isRed) {
            if (isGreen) greenCount++;
            if (isRed) redCount++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const total = greenCount + redCount;
      const boxW = maxX - minX;
      const boxH = maxY - minY;

      if (total >= 3 && boxW > 0 && boxH > 0 && (boxW / boxH) < 2.5) {
        return {
          found: true,
          color: greenCount > redCount ? 'green' : 'red',
          bbox: [
            Math.max(0, minX - 12), 
            Math.max(0, minY - 12), 
            Math.min(width, boxW + 24), 
            Math.min(height, boxH + 24)
          ]
        };
      }
      return { found: false };
    }

    async function processFrame() {
      if (isProcessing) return;
      isProcessing = true;

      try {
        let detected = false;

        if (model) {
          const predictions = await model.detect(canvas);
          const candidates = predictions.filter(p => (p.class === 'traffic light' || p.class === 'stop sign') && p.score > 0.10);

          if (candidates.length > 0) {
            for (const cand of candidates) {
              const color = analyzeColorInRoi(ctx, cand.bbox[0], cand.bbox[1], cand.bbox[2], cand.bbox[3]);
              if (color !== 'unknown') {
                drawResult(color, cand.bbox, Math.round(cand.score * 100));
                detected = true;
                break;
              }
            }
          }
        }

        if (!detected) {
          const fallback = lightSpotSearch(canvas.width, canvas.height);
          if (fallback.found) {
            drawResult(fallback.color, fallback.bbox, null);
            detected = true;
          }
        }

        if (!detected) {
          statusDiv.innerText = "Keine Ampel erkannt.";
          statusDiv.style.borderColor = "#dc3545";
        }

      } catch (err) {
        console.error(err);
      } finally {
        isProcessing = false;
      }
    }

    function drawResult(color, bbox, score) {
      const [x, y, w, h] = bbox;
      const scoreText = score ? ` (${score}%)` : " (Licht-Erkennung)";
      const colorName = color === 'green' ? 'Grüne' : 'Rote';
      const strokeColor = color === 'green' ? '#00FF00' : '#FF0000';

      statusDiv.innerText = `${colorName} Ampel erkannt!${scoreText}`;
      statusDiv.style.borderColor = strokeColor;

      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = Math.max(3, Math.round(canvas.width / 200));
      ctx.strokeRect(x, y, w, h);
    }

    // Direkter Event-Listener für den Bild-Upload
    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      statusDiv.innerText = "Lade Bild...";

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          isStaticImage = true;

          const maxDim = 800;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          canvas.style.height = 'auto';
          ctx.drawImage(img, 0, 0, w, h);

          statusDiv.innerText = "Analysiere...";
          processFrame();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Kamera optional und abgesichert starten
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          renderLoop();
        };
      }).catch(err => {
        statusDiv.innerText = "Kamera blockiert – Bitte Testbild wählen";
      });
    }

    function renderLoop() {
      if (!isStaticImage && video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        processFrame();
        requestAnimationFrame(renderLoop);
      }
    }
  </script>
</body>
</html>
