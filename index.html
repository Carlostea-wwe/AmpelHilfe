<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
    video { display: none; }
  </style>
</head>
<body>

  <div id="status">Starte Kamera...</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <video id="webcam" autoplay playsinline></video>
  
  <input type="file" id="imageLoader" accept="image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');
    const video = document.getElementById('webcam');

    let isStaticImage = false;

    // 1. RGB zu HSV Konvertierung
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // 2. Erweitertes HSV-Filtering (Grün & Rot)
    function detectSignalRegion(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      let minX = width, maxX = 0, minY = height, maxY = 0;
      let greenCount = 0;
      let redCount = 0;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const [h, s, v] = rgbToHsv(r, g, b);

          // Ampel-Grün (120° - 170°)
          const isGreen = (h >= 120 && h <= 170 && s >= 40 && v >= 45);
          // Ampel-Rot (0°-12° oder 340°-360°)
          const isRed = ((h <= 12 || h >= 340) && s >= 55 && v >= 45);

          if (isGreen || isRed) {
            if (isGreen) greenCount++;
            if (isRed) redCount++;

            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const totalPixel = greenCount + redCount;
      const boxWidth = maxX - minX;
      const boxHeight = maxY - minY;
      const aspectRatio = boxWidth / (boxHeight || 1);

      // Plausibilitätsprüfungen:
      // 1. Genug Pixel vorhanden?
      // 2. Ist die Box extrem breit und flach? (Typisch für Baumlaub im Hintergrund) -> Verwerfen!
      const isValidShape = aspectRatio < 2.5;
      const hasSignal = totalPixel >= 5 && isValidShape;

      const detectedColor = greenCount > redCount ? 'green' : 'red';

      return {
        found: hasSignal,
        color: detectedColor,
        pixelCount: totalPixel,
        boundingBox: hasSignal ? {
          x: minX,
          y: minY,
          width: Math.max(boxWidth, 12),
          height: Math.max(boxHeight, 12)
        } : null
      };
    }

    // 3. Auswertung und Visuelle Markierung
    function processFrame() {
      const result = detectSignalRegion(ctx, canvas.width, canvas.height);

      if (result.found) {
        const colorName = result.color === 'green' ? 'Grünes' : 'Rotes';
        const strokeColor = result.color === 'green' ? '#00FF00' : '#FF0000';

        statusDiv.innerText = `${colorName} Signal erkannt! (${result.pixelCount} Pixel)`;
        statusDiv.style.borderColor = strokeColor;
        
        const box = result.boundingBox;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = Math.max(3, Math.round(canvas.width / 250));

        // Ausreichend großen Rahmen zeichnen
        const pad = 8;
        ctx.strokeRect(
          Math.max(0, box.x - pad), 
          Math.max(0, box.y - pad), 
          box.width + (pad * 2), 
          box.height + (pad * 2)
        );
      } else {
        statusDiv.innerText = "Kein Signal erkannt.";
        statusDiv.style.borderColor = "#dc3545";
      }
    }

    // 4. Kamera-Stream
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          renderLoop();
        };
      } catch (err) {
        statusDiv.innerText = "Kamera nicht verfügbar. Bitte Testbild laden.";
      }
    }

    function renderLoop() {
      if (!isStaticImage && video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        processFrame();
      }
      requestAnimationFrame(renderLoop);
    }

    // 5. Datei-Upload
    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          isStaticImage = true;
          
          const maxDim = 800;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          processFrame();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    startCamera();
  </script>
</body>
</html>
