<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      height: 350px;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <div id="status">Suche nach Ampel...</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <!-- Breiterer Dateityp-Filter gegen Ladeblockaden auf Mobilgeräten -->
  <input type="file" id="imageLoader" accept="image/jpeg,image/png,image/webp,image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');

    // Canvas-Vorschaufeld beim ersten Aufruf zeichnen
    function initCanvas() {
      canvas.width = 600;
      canvas.height = 400;
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#888888';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Kein Bild geladen', canvas.width / 2, canvas.height / 2);
    }
    initCanvas();

    // 1. RGB zu HSV Konvertierung
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // 2. HSV-Analyse
    function detectGreenLightRegion(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      let minX = width, maxX = 0, minY = height, maxY = 0;
      let greenPixelCount = 0;
      const step = 2; 

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const i = (y * width + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const [h, s, v] = rgbToHsv(r, g, b);

          if (h >= 140 && h <= 175 && s >= 40 && v >= 50) {
            greenPixelCount++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const hasGreenLight = greenPixelCount > 15;

      return {
        found: hasGreenLight,
        pixelCount: greenPixelCount,
        boundingBox: hasGreenLight ? {
          x: minX,
          y: minY,
          width: maxX - minX,
          height: maxY - minY
        } : null
      };
    }

    // 3. Bild-Upload und Verarbeitung
    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          // Canvas auf Pixelgröße des geknipsten/ausgewählten Bildes setzen
          canvas.width = img.width;
          canvas.height = img.height;
          
          // Höhe im CSS auf 'auto' stellen, damit das Bild nicht verzerrt wird
          canvas.style.height = 'auto';

          // Bild zeichnen
          ctx.drawImage(img, 0, 0);

          // HSV-Analyse ausführen
          const result = detectGreenLightRegion(ctx, canvas.width, canvas.height);

          if (result.found) {
            statusDiv.innerText = `Grünes Signal erkannt! (${result.pixelCount} Pixel)`;
            statusDiv.style.borderColor = "#28a745";
            
            const box = result.boundingBox;
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = Math.max(4, Math.round(canvas.width / 200));
            ctx.strokeRect(box.x, box.y, box.width, box.height);
          } else {
            statusDiv.innerText = "Kein grünes Signal erkannt.";
            statusDiv.style.borderColor = "#dc3545";
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
