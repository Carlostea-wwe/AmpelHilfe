<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      height: 350px;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
    video { display: none; }
  </style>
</head>
<body>

  <div id="status">Wähle ein Bild oder starte die Kamera</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <video id="webcam" autoplay playsinline></video>
  
  <input type="file" id="imageLoader" accept="image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');
    const video = document.getElementById('webcam');

    let model = null;
    let isProcessing = false;
    let isStaticImage = false;

    function resetCanvas() {
      canvas.width = 600;
      canvas.height = 400;
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#888888';
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Kein Bild geladen', canvas.width / 2, canvas.height / 2);
    }
    resetCanvas();

    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
    }).catch(err => console.log("KI nicht geladen, nutze Licht-Fallback"));

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // Farbanalyse innerhalb der Bounding Box (ROI)
    function analyzeColorInRoi(ctx, x, y, w, h) {
      const rx = Math.max(0, Math.round(x));
      const ry = Math.max(0, Math.round(y));
      const rw = Math.max(1, Math.min(canvas.width - rx, Math.round(w)));
      const rh = Math.max(1, Math.min(canvas.height - ry, Math.round(h)));

      const imgData = ctx.getImageData(rx, ry, rw, rh);
      const data = imgData.data;

      let greenCount = 0, redCount = 0;

      for (let i = 0; i < data.length; i += 4) {
        const [hue, sat, val] = rgbToHsv(data[i], data[i + 1], data[i + 2]);
        
        // Signal-Grün (Leuchtend)
        if (hue >= 115 && hue <= 175 && sat >= 25 && val >= 40) greenCount++;
        // Signal-Rot (Hohe Helligkeit, um Schilder zu vermeiden)
        if ((hue <= 10 || hue >= 345) && sat >= 55 && val >= 60) redCount++;
      }

      if (greenCount > redCount && greenCount >= 2) return 'green';
      if (redCount > greenCount && redCount >= 2) return 'red';
      return 'unknown';
    }

    // Präzise Leuchtfleck-Suche für kompakte Ampelpunkte (Filtert Straßenschilder & Kleidung raus)
    function compactLightSpotSearch(width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      let greenPixels = [];
      let redPixels = [];

      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          const i = (y * width + x) * 4;
          const [h, s, v] = rgbToHsv(data[i], data[i + 1], data[i + 2]);

          // Nur leuchtende LED-Pixel akzeptieren (High Brightness/Saturation)
          if (h >= 115 && h <= 175 && s >= 30 && v >= 60) {
            greenPixels.push({x, y});
          }
          if ((h <= 8 || h >= 350) && s >= 65 && v >= 75) {
            redPixels.push({x, y});
          }
        }
      }

      // Prüfe auf kompaktes Grün-Cluster
      if (greenPixels.length >= 3) {
        const box = getBoundingBoxFromPixels(greenPixels, width, height);
        if (box && box.w < (width * 0.15) && box.h < (height * 0.25)) {
          return { found: true, color: 'green', bbox: [box.x, box.y, box.w, box.h] };
        }
      }

      // Prüfe auf kompaktes Rot-Cluster
      if (redPixels.length >= 3) {
        const box = getBoundingBoxFromPixels(redPixels, width, height);
        if (box && box.w < (width * 0.12) && box.h < (height * 0.20)) {
          return { found: true, color: 'red', bbox: [box.x, box.y, box.w, box.h] };
        }
      }

      return { found: false };
    }

    function getBoundingBoxFromPixels(pixels, imgW, imgH) {
      let minX = imgW, maxX = 0, minY = imgH, maxY = 0;
      for (const p of pixels) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const w = maxX - minX;
      const h = maxY - minY;
      
      const pad = 10;
      return {
        x: Math.max(0, minX - pad),
        y: Math.max(0, minY - pad),
        w: Math.min(imgW, w + pad * 2),
        h: Math.min(imgH, h + pad * 2)
      };
    }

    async function processFrame() {
      if (isProcessing) return;
      isProcessing = true;

      try {
        let detected = false;

        // 1. KI-Objekterkennung (Niedriger Schwellenwert 0.05 für seitliche Ampeln wie auf Bild 2)
        if (model) {
          const predictions = await model.detect(canvas);
          const candidates = predictions.filter(p => (p.class === 'traffic light' || p.class === 'stop sign') && p.score > 0.05);

          if (candidates.length > 0) {
            for (const cand of candidates) {
              const color = analyzeColorInRoi(ctx, cand.bbox[0], cand.bbox[1], cand.bbox[2], cand.bbox[3]);
              if (color !== 'unknown') {
                drawResult(color, cand.bbox, Math.round(cand.score * 100));
                detected = true;
                break;
              }
            }
          }
        }

        // 2. Kompakter Leuchtfleck-Fallback (für verdeckte Signale & Nacht)
        if (!detected) {
          const fallback = compactLightSpotSearch(canvas.width, canvas.height);
          if (fallback.found) {
            drawResult(fallback.color, fallback.bbox, null);
            detected = true;
          }
        }

        if (!detected) {
          statusDiv.innerText = "Keine Ampel erkannt.";
          statusDiv.style.borderColor = "#dc3545";
        }

      } catch (err) {
        console.error(err);
      } finally {
        isProcessing = false;
      }
    }

    function drawResult(color, bbox, score) {
      const [x, y, w, h] = bbox;
      const scoreText = score ? ` (${score}%)` : " (Licht-Erkennung)";
      const colorName = color === 'green' ? 'Grüne' : 'Rote';
      const strokeColor = color === 'green' ? '#00FF00' : '#FF0000';

      statusDiv.innerText = `${colorName} Ampel erkannt!${scoreText}`;
      statusDiv.style.borderColor = strokeColor;

      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = Math.max(3, Math.round(canvas.width / 200));
      ctx.strokeRect(x, y, w, h);
    }

    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      statusDiv.innerText = "Lade Bild...";

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          isStaticImage = true;

          const maxDim = 800;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          canvas.style.height = 'auto';
          ctx.drawImage(img, 0, 0, w, h);

          statusDiv.innerText = "Analysiere...";
          processFrame();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          renderLoop();
        };
      }).catch(err => {
        statusDiv.innerText = "Kamera blockiert – Bitte Testbild wählen";
      });
    }

    function renderLoop() {
      if (!isStaticImage && video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        processFrame();
        requestAnimationFrame(renderLoop);
      }
    }
  </script>
</body>
</html>
