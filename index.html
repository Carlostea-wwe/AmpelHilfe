<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampel-Erkennung</title>
  
  <!-- TensorFlow.js und COCO-SSD Modell aus CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1e1e1e;
    }
    .canvas-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
    }
    video { display: none; }
  </style>
</head>
<body>

  <div id="status">Bereit. Lade KI im Hintergrund...</div>
  
  <div class="canvas-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  
  <video id="webcam" autoplay playsinline></video>
  
  <input type="file" id="imageLoader" accept="image/*" style="display: none;">
  <button class="btn" onclick="document.getElementById('imageLoader').click();">📷 Eigene Testbilder testen (JPG)</button>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const imageLoader = document.getElementById('imageLoader');
    const video = document.getElementById('webcam');

    let model = null;
    let isModelLoading = true;
    let isProcessing = false;
    let isStaticImage = false;

    // 1. KI-Modell im Hintergrund laden (ohne UI zu blockieren)
    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
      isModelLoading = false;
      statusDiv.innerText = "KI-Modell bereit!";
      statusDiv.style.borderColor = "#28a745";
    }).catch(err => {
      isModelLoading = false;
      statusDiv.innerText = "KI-Modell konnte nicht geladen werden.";
      console.error(err);
    });

    // 2. RGB zu HSV Konvertierung
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // 3. Farbanalyse innerhalb der KI Bounding Box
    function analyzeTrafficLightColor(ctx, bbox) {
      const [x, y, w, h] = bbox;
      const imgData = ctx.getImageData(Math.max(0, Math.round(x)), Math.max(0, Math.round(y)), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
      const data = imgData.data;

      let greenCount = 0;
      let redCount = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const [hue, sat, val] = rgbToHsv(r, g, b);

        if (hue >= 120 && hue <= 175 && sat >= 35 && val >= 45) greenCount++;
        if ((hue <= 12 || hue >= 340) && sat >= 45 && val >= 45) redCount++;
      }

      if (greenCount > redCount && greenCount > 2) return 'green';
      if (redCount > greenCount && redCount > 2) return 'red';
      return 'unknown';
    }

    // 4. Hauptanalyse
    async function processFrame() {
      if (!model || isProcessing) return;
      isProcessing = true;

      try {
        const predictions = await model.detect(canvas);
        const trafficLights = predictions.filter(p => p.class === 'traffic light' && p.score > 0.25);

        if (trafficLights.length > 0) {
          const bestMatch = trafficLights.reduce((max, p) => p.score > max.score ? p : max, trafficLights[0]);
          const [x, y, w, h] = bestMatch.bbox;

          const state = analyzeTrafficLightColor(ctx, bestMatch.bbox);

          let statusText = "";
          let colorCode = "#00FF00";

          if (state === 'green') {
            statusText = `Grüne Ampel erkannt! (${Math.round(bestMatch.score * 100)}%)`;
            colorCode = "#00FF00";
          } else if (state === 'red') {
            statusText = `Rote Ampel erkannt! (${Math.round(bestMatch.score * 100)}%)`;
            colorCode = "#FF0000";
          } else {
            statusText = `Ampelgehäuse erkannt (${Math.round(bestMatch.score * 100)}%)`;
            colorCode = "#FFD700";
          }

          statusDiv.innerText = statusText;
          statusDiv.style.borderColor = colorCode;

          ctx.strokeStyle = colorCode;
          ctx.lineWidth = Math.max(3, Math.round(canvas.width / 200));
          ctx.strokeRect(x, y, w, h);
        } else {
          statusDiv.innerText = "Keine Ampel erkannt.";
          statusDiv.style.borderColor = "#dc3545";
        }
      } catch (err) {
        console.error(err);
      } finally {
        isProcessing = false;
      }
    }

    // 5. Kamera-Stream starten
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          renderLoop();
        };
      } catch (err) {
        statusDiv.innerText = "Kamera nicht aktiv. Bitte Bild wählen.";
      }
    }

    function renderLoop() {
      if (!isStaticImage && video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        if (model && !isProcessing) {
          processFrame();
        }
      }
      requestAnimationFrame(renderLoop);
    }

    // 6. Bild-Upload (Funktioniert sofort!)
    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
          isStaticImage = true;

          const maxDim = 800;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          if (isModelLoading) {
            statusDiv.innerText = "Bild geladen. Warte auf KI-Modell...";
          } else if (model) {
            statusDiv.innerText = "Analysiere Bild...";
            await processFrame();
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    startCamera();
  </script>
</body>
</html>
